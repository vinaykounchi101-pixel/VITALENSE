[package]
name = "vitalsense-desktop-windows"
version = "0.1.0"
description = "VitalSense Windows Desktop Client — Privacy-First Health Intelligence"
authors = ["VitalSense Team"]
edition = "2021"

[dependencies]
tauri = { version = "1.6", features = ["system-tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
rusqlite = { version = "0.29", features = ["bundled-sqlcipher"] }
windows-sys = { version = "0.52", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_Memory"
] }

[build-dependencies]
tauri-build = { version = "1.6" }

