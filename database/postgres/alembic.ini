# =============================================================================
# VitalSense PostgreSQL Alembic Configuration
# =============================================================================

[alembic]
# Path to migration scripts (relative to this file)
script_location = database/postgres/migrations

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Sys.path prepends for importing models
prepend_sys_path = packages/python-common/src:.

# Timezone for generated migrations
timezone = UTC

# Max length of characters for "slug" field
truncate_slug_length = 40

# Version locations
version_locations = database/postgres/migrations/versions

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Database URL is read dynamically from vitalsense_common.config.settings in env.py
sqlalchemy.url = postgresql+asyncpg://vitalsense_user:replace_with_secure_dev_password@localhost:5432/vitalsense_dev

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
